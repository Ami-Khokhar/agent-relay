<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact review</title>
<style>
  :root{
    --bg:#f7f7f4; --fg:#161816; --muted:#5f655d; --line:#d8dbd5; --card:#fff;
    --accent:#2a5db0; --accent2:#a4442a; --ok:#1f7a4d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1110; --fg:#e9ebe5; --muted:#98a094; --line:#2a2e28; --card:#171a16;
           --accent:#84aaee; --accent2:#e2896b; --ok:#63c894; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
       font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex; align-items:center; gap:12px; padding:8px 14px; border-bottom:1px solid var(--line);
         background:var(--card); flex:none; flex-wrap:wrap}
  header h1{font-size:14px; margin:0; font-weight:650; max-width:38ch; overflow:hidden;
            text-overflow:ellipsis; white-space:nowrap}
  .grow{flex:1 1 auto}
  .chip{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px;
        padding:1px 8px; white-space:nowrap}
  button{font:inherit; font-size:12px; padding:4px 10px; border-radius:6px; border:1px solid var(--line);
         background:var(--card); color:var(--fg); cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  button.primary[aria-pressed="true"]{background:var(--accent2); border-color:var(--accent2)}
  button:disabled{opacity:.5; cursor:default}
  select{font:inherit; font-size:12px; padding:3px 6px; border-radius:6px; border:1px solid var(--line);
         background:var(--card); color:var(--fg)}
  main{flex:1 1 auto; display:flex; min-height:0}
  .stage{flex:1 1 auto; min-width:0; background:var(--bg)}
  iframe{width:100%; height:100%; border:0; display:block; background:#fff}
  aside[hidden]{display:none}
  aside{flex:0 0 360px; border-left:1px solid var(--line); background:var(--card); display:flex;
        flex-direction:column; min-height:0; max-width:40vw}
  @media (max-width:820px){
    aside{flex:0 0 46vw; max-width:none}
    main{flex-direction:column}
    .stage{flex:1 1 auto}
    aside{flex:0 0 45%; border-left:0; border-top:1px solid var(--line)}
  }
  .panel-head{display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line)}
  .panel-head strong{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
  .list{flex:1 1 auto; overflow:auto; padding:8px}
  .empty{color:var(--muted); font-size:13px; padding:12px}
  .item{border:1px solid var(--line); border-radius:8px; padding:9px 10px; margin-bottom:8px;
        background:var(--bg)}
  .item.resolved{opacity:.62}
  .item .row{display:flex; align-items:center; gap:6px; margin-bottom:4px}
  .num{flex:none; width:19px; height:19px; border-radius:50%; background:var(--accent); color:#fff;
       font-size:11px; font-weight:650; display:grid; place-items:center}
  .item.resolved .num{background:#8a8f88}
  .who{font-size:11px; color:var(--muted)}
  .quote{font-size:12px; color:var(--muted); border-left:2px solid var(--line); padding-left:7px;
         margin:5px 0; max-height:3.6em; overflow:hidden}
  .body{margin:4px 0; white-space:pre-wrap; overflow-wrap:anywhere}
  .replies .reply{margin:6px 0 0 0; padding-left:8px; border-left:2px solid var(--line); font-size:13px}
  .actions{display:flex; gap:6px; margin-top:7px}
  .actions button{font-size:11px; padding:2px 8px}
  .composer{border-top:1px solid var(--line); padding:10px 12px; background:var(--card)}
  .composer textarea{width:100%; min-height:64px; resize:vertical; font:inherit; font-size:13px;
                     padding:7px 8px; border-radius:6px; border:1px solid var(--line);
                     background:var(--bg); color:var(--fg)}
  .composer .row{display:flex; align-items:center; gap:8px; margin-top:7px}
  .hint{font-size:11px; color:var(--muted)}
  .badge-stale{font-size:10px; color:var(--accent2); border:1px solid var(--accent2);
               border-radius:999px; padding:0 6px}
  .notice{margin:8px 12px; font-size:12px; color:var(--muted)}
  #newversion{background:var(--accent);border-color:var(--accent);color:#fff}
  .sessions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);
            align-items:center}
  .sessions .who{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
                 width:100%}
  .agent{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;
         color:var(--muted);white-space:nowrap}
  .agent.live{color:var(--ok);border-color:var(--ok)}
  .agent.origin{font-weight:650}
  .targets{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
  .targets button{font-size:11px;padding:2px 9px;border-radius:999px}
  .targets button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .delivery{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .delivery span{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:0 6px;
                 color:var(--muted);white-space:nowrap}
  .delivery span.claimed{color:var(--ok);border-color:var(--ok)}
  .delivery span.waiting{color:var(--accent2);border-color:var(--accent2)}
  .composer{position:relative}
  .mentions{position:absolute;left:12px;right:12px;bottom:100%;margin-bottom:4px;
            background:var(--card);border:1px solid var(--line);border-radius:8px;
            box-shadow:0 6px 24px rgba(0,0,0,.18);overflow:hidden;z-index:5}
  .mentions button{display:flex;width:100%;gap:8px;align-items:baseline;text-align:left;
                   border:0;border-radius:0;background:transparent;padding:7px 10px;font-size:12px}
  .mentions button[aria-selected="true"]{background:var(--accent);color:#fff}
  .mentions .role{font-size:10px;color:var(--muted)}
  .mentions button[aria-selected="true"] .role{color:rgba(255,255,255,.8)}
  .mentions .handle{font-weight:650}
</style>
</head>
<body>
<header>
  <h1 id="title">Artifact</h1>
  <span class="chip" id="version-chip">v0</span>
  <span class="grow"></span>
  <label class="hint" id="version-label" for="version">Version</label>
  <select id="version"></select>
  <button id="mode" aria-pressed="false">Comment mode</button>
  <button id="newversion" hidden>New version</button>
  <button id="only" aria-pressed="false" title="Hide the review panel without leaving this page">Artifact only</button>
</header>
<main>
  <div class="stage"><iframe id="frame" title="Artifact" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe></div>
  <aside>
    <div class="panel-head">
      <strong>Comments</strong>
      <span class="chip" id="count">0 open</span>
      <span class="grow"></span>
      <button id="show-resolved" aria-pressed="false">Show resolved</button>
    </div>
    <div class="sessions" id="sessions"></div>
    <div class="list" id="list"></div>
    <div class="composer" id="composer" hidden>
      <div class="mentions" id="mentions" hidden></div>
      <div class="hint" id="pick-hint">New comment on the element you picked</div>
      <div class="quote" id="pick-quote"></div>
      <textarea id="input" placeholder="What should change? Type @name to address one agent."></textarea>
      <div class="targets" id="targets"></div>
      <div class="row">
        <button class="primary" id="send">Add comment</button>
        <button id="cancel">Cancel</button>
        <span class="hint" id="send-hint"></span>
      </div>
    </div>
  </aside>
</main>
<script>
(function () {
  "use strict";
  var parts = window.location.pathname.split("/").filter(Boolean); // a, <slug>
  var slug = decodeURIComponent(parts[1] || "");
  var state = { artifact: null, comments: [], sessions: [], handles: [], targets: new Set(),
                version: 0, mode: false, only: false, showResolved: false, pick: null };
  var contentOrigin = "";
  var frame = document.getElementById("frame");
  var list = document.getElementById("list");
  var composer = document.getElementById("composer");
  var input = document.getElementById("input");

  function api(path, options) {
    var headers = { "content-type": "application/json", "x-artifacts-client": "1" };
    return fetch(path, Object.assign({ headers: headers }, options || {}))
      .then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status);
        return response.json();
      });
  }

  function post(message) {
    // The frame is on the content origin, so it is named explicitly.
    if (frame.contentWindow) frame.contentWindow.postMessage(message, contentOrigin || "*");
  }

  function sendToFrame() {
    post({ type: "mode", on: state.mode });
    post({ type: "comments", comments: visible().map(function (comment, index) {
      return { id: comment.id, body: comment.body, status: comment.status,
               anchor: comment.anchor, number: typeof comment.seq === "number" ? comment.seq : index + 1 };
    }) });
  }

  function visible() {
    return state.comments.filter(function (comment) {
      return state.showResolved || comment.status !== "resolved";
    });
  }

  function commentPath(comment) {
    return comment.version === state.version ? "" : '<span class="badge-stale">v' + comment.version + "</span>";
  }

  function render() {
    var open = state.comments.filter(function (c) { return c.status !== "resolved"; }).length;
    document.getElementById("count").textContent = open + " open";
    var nodes = visible();
    if (!nodes.length) {
      list.innerHTML = '<div class="empty">No comments yet. Turn on comment mode and click an element in the artifact.</div>';
      return;
    }
    var html = "";
    nodes.forEach(function (comment, index) {
      html += '<div class="item' + (comment.status === "resolved" ? " resolved" : "") + '" data-id="' + comment.id + '">';
      var number = typeof comment.seq === "number" ? comment.seq : index + 1;
      html += '<div class="row"><span class="num">' + number + "</span>";
      html += '<span class="who">' + escapeHtml(comment.author || "owner") + " · " + when(comment.created) + "</span>";
      html += '<span class="grow"></span>' + commentPath(comment) + "</div>";
      if (comment.anchor && comment.anchor.quote) {
        html += '<div class="quote">' + escapeHtml(comment.anchor.quote) + "</div>";
      }
      html += '<div class="body">' + escapeHtml(comment.body) + "</div>";
      if (comment.replies && comment.replies.length) {
        html += '<div class="replies">';
        comment.replies.forEach(function (reply) {
          html += '<div class="reply"><span class="who">' + escapeHtml(reply.author || "agent") +
                  "</span><div>" + escapeHtml(reply.body) + "</div></div>";
        });
        html += "</div>";
      }
      if (comment.delivery && comment.delivery.length) {
        html += '<div class="delivery">';
        comment.delivery.forEach(function (item) {
          var label = item.handle + " " + ({ claimed: "delivered", queued: "active, not taken yet",
            waiting: "awaits that agent", resolved: "closed" }[item.state] || item.state);
          html += '<span class="' + escapeHtml(item.state || "") + '">' + escapeHtml(label) + "</span>";
        });
        html += "</div>";
      }
      html += '<div class="actions">';
      html += '<button data-act="reply">Reply</button>';
      html += '<button data-act="focus">Show</button>';
      html += '<button data-act="toggle">' + (comment.status === "resolved" ? "Reopen" : "Resolve") + "</button>";
      html += "</div></div>";
    });
    list.innerHTML = html;
  }

  function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function when(iso) {
    try {
      return new Date(iso).toLocaleTimeString();
    } catch (error) {
      return "";
    }
  }

  function loadComments() {
    return api("/api/artifacts/" + encodeURIComponent(slug) + "/comments").then(function (data) {
      state.comments = data.comments || [];
      render();
      sendToFrame();
    });
  }

  function loadArtifact(initial) {
    return api("/api/artifacts/" + encodeURIComponent(slug)).then(function (data) {
      var hadVersion = state.version;
      var versionBefore = state.artifact ? state.artifact.currentVersion : null;
      state.artifact = data;
      if (initial !== false) state.version = data.currentVersion;
      else if (hadVersion && hadVersion <= data.currentVersion) state.version = hadVersion;
      document.title = data.title + " · review";
      try {
        contentOrigin = data.rawBase ? new URL(data.rawBase).origin : "";
      } catch (error) {
        contentOrigin = "";
      }
      document.getElementById("title").textContent = data.title;
      var select = document.getElementById("version");
      select.innerHTML = "";
      data.versions.slice().reverse().forEach(function (version) {
        var option = document.createElement("option");
        option.value = String(version.n);
        option.textContent = "v" + version.n + " · " + when(version.created);
        select.appendChild(option);
      });
      select.value = String(state.version);
      document.getElementById("version-chip").textContent = "v" + state.version;
      var newer = state.version < data.currentVersion;
      var badge = document.getElementById("newversion");
      badge.hidden = !newer;
      badge.textContent = "Show v" + data.currentVersion;
      // A poll must never reset the reviewer's scroll, so the stage reloads only
      // on first paint; a newer version waits behind the Show vN button.
      if (initial !== false) setFrame();
    });
  }

  document.getElementById("newversion").addEventListener("click", function () {
    state.version = state.artifact.currentVersion;
    document.getElementById("version-chip").textContent = "v" + state.version;
    document.getElementById("newversion").hidden = true;
    document.getElementById("version").value = String(state.version);
    setFrame();
  });

  function roleOf(record) {
    var origin = state.artifact && state.artifact.origin;
    if (origin && origin.session && record.id === origin.session) return "publisher session";
    return record.live ? "attached, active now" : "attached, idle until it reads its inbox";
  }

  function loadSessions() {
    return api("/api/artifacts/" + encodeURIComponent(slug) + "/sessions").then(function (data) {
      state.sessions = data.sessions || [];
      state.handles = data.handles || [];
      renderSessions();
      renderTargets();
    });
  }

  function renderSessions() {
    var host = document.getElementById("sessions");
    var origin = state.artifact && state.artifact.origin;
    host.textContent = "";
    var label = document.createElement("span");
    label.className = "who";
    label.textContent = "sessions";
    host.appendChild(label);
    state.sessions.forEach(function (record) {
      var chip = document.createElement("span");
      chip.className = "agent" + (record.live ? " live" : "") +
        (origin && origin.session === record.id ? " origin" : "");
      chip.textContent = record.handle;
      chip.title = record.handle + " · " + record.id + " · " + roleOf(record) +
        (record.cwd ? " · " + record.cwd : "");
      host.appendChild(chip);
    });
    if (!state.sessions.length) {
      var none = document.createElement("span");
      none.className = "agent";
      none.textContent = "no agent attached yet";
      host.appendChild(none);
    }
  }

  function renderTargets() {
    var host = document.getElementById("targets");
    host.textContent = "";
    var label = document.createElement("span");
    label.className = "hint";
    label.textContent = "Send to";
    host.appendChild(label);
    var chip = function (text, on, onClick, title) {
      var button = document.createElement("button");
      button.type = "button";
      button.textContent = text;
      button.setAttribute("aria-pressed", String(on));
      if (title) button.title = title;
      button.addEventListener("click", onClick);
      host.appendChild(button);
    };
    chip("everyone attached", state.targets.size === 0, function () {
      state.targets.clear();
      renderTargets();
    }, "Unaddressed: any attached agent can claim it");
    state.handles.forEach(function (handle) {
      chip(handle, state.targets.has(handle), function () {
        if (state.targets.has(handle)) state.targets.delete(handle);
        else state.targets.add(handle);
        renderTargets();
      }, "Addressed to this agent only");
    });
  }

  var mentionState = { open: false, index: 0, options: [], start: 0 };

  function mentionToken() {
    var caret = input.selectionStart == null ? input.value.length : input.selectionStart;
    var match = /(^|\s)@([a-z0-9._-]*)$/i.exec(input.value.slice(0, caret));
    if (!match) return null;
    return { start: caret - match[2].length - 1, query: match[2].toLowerCase() };
  }

  function closeMentions() {
    mentionState.open = false;
    document.getElementById("mentions").hidden = true;
  }

  function mentionOptions(query) {
    var origin = state.artifact && state.artifact.origin;
    var options = [{ handle: "@owner", role: "you, the reviewer" }];
    state.handles.forEach(function (handle) {
      var record = state.sessions.filter(function (item) { return item.handle === handle; })[0] || {};
      options.push({ handle: handle, role: roleOf(record) });
    });
    return options.filter(function (option) {
      if (!query) return true;
      return option.handle.toLowerCase().indexOf("@" + query) === 0;
    });
  }

  function drawMentions() {
    var host = document.getElementById("mentions");
    host.textContent = "";
    mentionState.options.forEach(function (option, index) {
      var button = document.createElement("button");
      button.type = "button";
      button.setAttribute("aria-selected", String(index === mentionState.index));
      var handle = document.createElement("span");
      handle.className = "handle";
      handle.textContent = option.handle;
      var role = document.createElement("span");
      role.className = "role";
      role.textContent = option.role;
      button.appendChild(handle);
      button.appendChild(role);
      button.addEventListener("mousedown", function (event) {
        event.preventDefault();
        pickMention(index);
      });
      host.appendChild(button);
    });
    host.hidden = false;
  }

  function openMentions() {
    var token = mentionToken();
    if (!token) return closeMentions();
    var options = mentionOptions(token.query);
    if (!options.length) return closeMentions();
    mentionState = { open: true, index: 0, options: options, start: token.start };
    drawMentions();
  }

  function pickMention(index) {
    var option = mentionState.options[index];
    closeMentions();
    if (!option || option.handle === "@owner") return;
    var caret = input.selectionStart == null ? input.value.length : input.selectionStart;
    var before = input.value.slice(0, mentionState.start);
    var after = input.value.slice(caret);
    input.value = before + option.handle + " " + after;
    var position = (before + option.handle + " ").length;
    input.setSelectionRange(position, position);
    state.targets.add(option.handle);
    renderTargets();
    input.focus();
  }

  function setFrame() {
    var review = state.only ? "" : "&review=1";
    var base = (state.artifact && state.artifact.rawBase) || "";
    if (!base) return;
    frame.src = base + "/raw?v=" + state.version + review + "&t=" + Date.now();
  }

  function setOnly(next) {
    state.only = !!next;
    document.getElementById("only").setAttribute("aria-pressed", String(state.only));
    document.getElementById("only").textContent = state.only ? "Back to review" : "Artifact only";
    document.querySelector("aside").hidden = state.only;
    document.getElementById("mode").hidden = state.only;
    document.getElementById("version").hidden = state.only;
    document.getElementById("version-label").hidden = state.only;
    document.getElementById("version-chip").hidden = state.only;
    composer.hidden = true;
    state.pick = null;
    setFrame();
  }

  frame.addEventListener("load", function () {
    sendToFrame();
  });

  window.addEventListener("message", function (event) {
    // Only the artifact frame on the content origin may drive this page.
    if (contentOrigin && event.origin !== contentOrigin) return;
    if (event.source && frame.contentWindow && event.source !== frame.contentWindow) return;
    var data = event.data || {};
    if (data.slug && data.slug !== slug) return;
    if (data.type === "ready") {
      sendToFrame();
    } else if (data.type === "pick") {
      state.mode = false;
      document.getElementById("mode").setAttribute("aria-pressed", "false");
      state.pick = data.anchor || {};
      document.getElementById("pick-quote").textContent = state.pick.quote || "(no text)";
      document.getElementById("pick-hint").textContent = "New comment on the element you picked";
      composer.hidden = false;
      input.focus();
    } else if (data.type === "mode") {
      state.mode = !!data.on;
      document.getElementById("mode").setAttribute("aria-pressed", String(state.mode));
    } else if (data.type === "open") {
      var node = list.querySelector('[data-id="' + data.id + '"]');
      if (node) node.scrollIntoView({ block: "center", behavior: "smooth" });
    }
  });

  document.getElementById("mode").addEventListener("click", function (event) {
    state.mode = !state.mode;
    event.currentTarget.setAttribute("aria-pressed", String(state.mode));
    post({ type: "mode", on: state.mode });
  });

  document.getElementById("only").addEventListener("click", function () {
    setOnly(!state.only);
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && state.only) setOnly(false);
  });

  document.getElementById("show-resolved").addEventListener("click", function (event) {
    state.showResolved = !state.showResolved;
    event.currentTarget.setAttribute("aria-pressed", String(state.showResolved));
    render();
    sendToFrame();
  });

  document.getElementById("version").addEventListener("change", function (event) {
    state.version = Number(event.target.value) || state.version;
    document.getElementById("version-chip").textContent = "v" + state.version;
    setFrame();
  });

  document.getElementById("cancel").addEventListener("click", function () {
    composer.hidden = true;
    state.pick = null;
    input.value = "";
  });

  input.addEventListener("input", openMentions);
  input.addEventListener("click", openMentions);
  input.addEventListener("blur", function () { window.setTimeout(closeMentions, 150); });
  input.addEventListener("keydown", function (event) {
    if (!mentionState.open) return;
    if (event.key === "ArrowDown" || event.key === "ArrowUp") {
      event.preventDefault();
      var step = event.key === "ArrowDown" ? 1 : -1;
      mentionState.index = (mentionState.index + step + mentionState.options.length) %
        mentionState.options.length;
      drawMentions();
    } else if (event.key === "Enter" || event.key === "Tab") {
      event.preventDefault();
      pickMention(mentionState.index);
    } else if (event.key === "Escape") {
      event.preventDefault();
      closeMentions();
    }
  });

  document.getElementById("send").addEventListener("click", function () {
    var body = input.value.trim();
    if (!body) return;
    var button = this;
    button.disabled = true;
    api("/api/artifacts/" + encodeURIComponent(slug) + "/comments", {
      method: "POST",
      body: JSON.stringify({ body: body, author: "owner", version: state.version,
                             anchor: state.pick, to: Array.from(state.targets) })
    }).then(function () {
      input.value = "";
      composer.hidden = true;
      state.pick = null;
      state.targets.clear();
      renderTargets();
      return loadComments();
    }).catch(function (error) {
      document.getElementById("send-hint").textContent = "Failed: " + error.message;
    }).then(function () {
      button.disabled = false;
    });
  });

  list.addEventListener("click", function (event) {
    var button = event.target.closest("button[data-act]");
    var item = event.target.closest(".item");
    if (!item) return;
    var id = item.getAttribute("data-id");
    var comment = state.comments.filter(function (c) { return c.id === id; })[0];
    if (!comment) return;
    if (!button) {
      post({ type: "focus", anchor: comment.anchor || {} });
      return;
    }
    if (button.getAttribute("data-act") === "focus") {
      post({ type: "focus", anchor: comment.anchor || {} });
    } else if (button.getAttribute("data-act") === "toggle") {
      api("/api/comments/" + encodeURIComponent(id) + "/status", {
        method: "POST",
        body: JSON.stringify({ status: comment.status === "resolved" ? "open" : "resolved", author: "owner" })
      }).then(loadComments);
    } else if (button.getAttribute("data-act") === "reply") {
      var text = window.prompt("Reply to this comment");
      if (text && text.trim()) {
        api("/api/comments/" + encodeURIComponent(id) + "/reply", {
          method: "POST",
          body: JSON.stringify({ body: text.trim(), author: "owner" })
        }).then(loadComments);
      }
    }
  });

  loadArtifact().then(loadSessions).then(loadComments).catch(function (error) {
    list.innerHTML = '<div class="empty">Could not load this artifact: ' + escapeHtml(error.message) + "</div>";
  });

  setInterval(function () {
    if (document.hidden) return;
    loadComments().catch(function () {});
  }, 2500);

  setInterval(function () {
    if (document.hidden) return;
    loadSessions().catch(function () {});
    loadArtifact(false).catch(function () {});
  }, 5000);
})();
</script>
</body>
</html>
