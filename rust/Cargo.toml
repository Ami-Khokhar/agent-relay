[package]
name = "artifactd"
version = "0.1.0"
edition = "2021"
description = "Local-only reviewable artifacts: publish HTML, comment on elements, route to agents"
license = "MIT"

[[bin]]
name = "artifactd"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
